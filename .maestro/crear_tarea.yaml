appId: com.taskmanager.app
---
# Flujo E2E: abrir la app, navegar a Todo List, crear una tarea
# y verificar que aparezca tanto el mensaje de éxito como en la lista

#- launchApp
- assertVisible: "Task Manager"
- tapOn: "Flujo Todo List"
- assertVisible: "Nueva tarea"
- tapOn:
    id: "input-titulo"
- inputText: "Mi primera tarea de prueba"
- tapOn: "Guardar"
- assertVisible: "Tarea creada exitosamente"
